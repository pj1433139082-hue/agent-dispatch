name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # 每天 03:00 UTC 跑一次并发稳定性

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python scripts/test_parallel.py -j 4

      - name: Run publish acceptance smoke
        run: python scripts/acceptance.py --json

  # 分支保护要求存在名为 "test" 的检查；矩阵 job 改名后由这个聚合 job 兜住。
  #
  # if: always() 不能省：默认 needs 里任一 job 失败时本 job 会变成 **skipped**，
  # 而 skipped 的必需检查在 GitHub 上「不阻拦合并」。2026-11-02 实测踩过：
  # #48 的 tests 在 ubuntu/macOS 双红，test 变 skipped，PR 照样合进 main，main 变红。
  # 加 always() + 显式判 result，这个 job 才会真 failure，门禁才真挡得住。
  test:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Matrix summary
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "::error::tests matrix result: ${{ needs.tests.result }} — required gate is not green"
            exit 1
          fi
          echo "ubuntu-latest and macos-latest passed"

  wrap:
    # 独立 job：wrap 自己的 smoke（健康仓 CLEAN / 缺 tickets 目录给明确错误）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Wrap smoke
        run: python scripts/wrap_smoke.py

  concurrency:
    # 并发/竞态用例单独反复跑：单跑一次说明不了稳定性
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Claim race, three rounds
        run: |
          for round in 1 2 3; do
            echo "== round $round =="
            python -m pytest -q tests/test_claim_concurrency.py
          done
      - name: Wave landing and packet gates, twice
        run: |
          for round in 1 2; do
            python -m pytest -q tests/test_land_wave.py tests/test_review_packet_gate.py
          done
