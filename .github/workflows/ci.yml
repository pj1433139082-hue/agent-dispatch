name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # 每天 03:00 UTC 跑一次并发稳定性

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python scripts/test_parallel.py -j 4

      - name: Run publish acceptance smoke
        run: python scripts/acceptance.py --json

  concurrency:
    # 并发/竞态用例单独反复跑：单跑一次说明不了稳定性
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Claim race, three rounds
        run: |
          for round in 1 2 3; do
            echo "== round $round =="
            python -m pytest -q tests/test_claim_concurrency.py
          done
      - name: Wave landing and packet gates, twice
        run: |
          for round in 1 2; do
            python -m pytest -q tests/test_land_wave.py tests/test_review_packet_gate.py
          done
