name: ✨ Feature Request / 功能建议
description: 提出新能力或流程改进建议。
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前流程里具体卡在哪里，不要只写“想要一个功能”。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明输入、输出、状态变化和验收方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 票据契约
        - 调度 / 分波
        - 验收 / 评审门禁
        - 导出 / 集成
        - 文档 / 开发体验
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有找到相同建议。
          required: true
